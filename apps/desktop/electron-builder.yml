# Packaging (phase 08 skeleton, phase 09): ad-hoc signed arm64 .dmg, macOS 14+, < 300 MB. The
# Resources of plan R1 "Packaged app" are staged by `scripts/build.ts --package` into out-resources/
# (styles, engine-data, hyperframes/node_modules, py/, bin/uv, cli/). Fuses per R4 S27. Notarization
# hooks stay off until there is a Developer ID (TODO).
appId: app.vox.studio
productName: Vox Studio
directories:
  output: dist
  buildResources: build
# Everything the app needs is bundled into out/ by scripts/build.ts --package; no node_modules.
files:
  - out/**/*
  - package.json
  - '!**/node_modules/**'
extraResources:
  - from: out-resources
    to: .
    filter: ['**/*']
asar: true
afterPack: scripts/after-pack.cjs
artifactName: Vox-Studio-${version}-arm64.${ext}
electronFuses:
  runAsNode: true # the vox CLI and the HyperFrames CLI run with Electron as Node
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
nodeGypRebuild: false
electronDist: node_modules/electron/dist
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.video
  minimumSystemVersion: '14.0'
  identity: '-'
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: false
publish: null
