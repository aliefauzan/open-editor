<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--tok-color-paper);
          color: var(--tok-color-ink);
        }
        .t-box {
          position: absolute;
          left: 8%;
          right: 8%;
          top: 30%;
          bottom: 30%;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        .t-title {
          font-family: var(--tok-font-display);
          font-weight: var(--tok-font-display-weight);
          line-height: 1.08;
          letter-spacing: -0.01em;
          overflow-wrap: anywhere;
        }
        .t-sub {
          margin-top: 0.8em;
          font-family: var(--tok-font-body);
          font-weight: var(--tok-font-body-weight);
          line-height: 1.25;
          overflow-wrap: anywhere;
        }
        .t-bar {
          margin-top: 0.6em;
          height: 0.18em;
          width: 30%;
          background: var(--tok-color-accent);
          transform-origin: 0 50%;
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="t-box">
          <div class="t-title"></div>
          <div class="t-bar"></div>
          <div class="t-sub"></div>
        </div>
      </div>
      <script>
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var w = __W__;
          var title = root.querySelector('.t-title');
          var sub = root.querySelector('.t-sub');
          var bar = root.querySelector('.t-bar');
          title.textContent = v.title;
          title.style.fontSize = Math.round(w * 0.075) + 'px';
          bar.style.fontSize = Math.round(w * 0.075) + 'px';
          sub.style.fontSize = Math.round(w * 0.04) + 'px';
          if (v.subtitle) sub.textContent = v.subtitle;
          else sub.style.display = 'none';
          var ease =
            getComputedStyle(root).getPropertyValue('--tok-motion-easing').trim() || 'power2.out';
          var tl = gsap.timeline({ paused: true });
          if (!v.skipEntrance) {
            tl.fromTo(
              title,
              { y: w * 0.05, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.5, ease: ease },
              0,
            );
            tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: ease }, 0.2);
            tl.fromTo(sub, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: ease }, 0.35);
          }
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
