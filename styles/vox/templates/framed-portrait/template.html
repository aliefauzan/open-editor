        .v-page::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 50% auto;
          mix-blend-mode: multiply;
          opacity: 0.22;
        }
        .v-page::after {
          content: '';
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(0 0 0 / 36%) 100%);
          pointer-events: none;
        }
        .v-page.bg-paper {
          background-color: var(--tok-color-paper);
          color: var(--tok-color-ink);
        }
        .v-page.bg-highlight {
          background-color: var(--tok-color-highlight);
          color: var(--tok-color-ink);
        }
        .v-page.bg-paper::after,
        .v-page.bg-highlight::after {
          opacity: 0.35;
        }
        .f-tag {
          position: absolute;
          padding: 0.34em 0.6em 0.28em;
          background: var(--tok-color-highlight);
          color: #111;
          font-family: 'Vox Grotesk', var(--tok-font-caption);
          font-weight: 800;
          line-height: 1;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          white-space: nowrap;
        }
        .v-page.bg-highlight .f-tag {
          background: var(--tok-color-ink);
          color: var(--tok-color-highlight);
        }
        .f-cam {
          position: absolute;
          inset: 0;
        }
        .f-group {
          position: absolute;
          left: 0;
          top: 0;
        }
        .f-frame {
          position: absolute;
          inset: 0;
        }
        .f-photo-box {
          position: absolute;
          overflow: hidden;
          background: #2b2721;
        }
        .f-iris,
        .f-zoom {
          position: absolute;
          inset: 0;
        }
        .f-photo {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .f-frame.gold .f-photo {
          filter: saturate(0.92) contrast(1.04);
        }
        .f-frame.polaroid .f-photo,
        .f-frame.none .f-photo {
          filter: grayscale(1) contrast(1.4) brightness(1.05) sepia(0.2);
        }
        .f-dots {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(circle, rgb(20 16 10 / 55%) 1.2px, transparent 1.9px);
          background-size: 5px 5px;
          mix-blend-mode: multiply;
        }
        .f-frame.gold .f-dots {
          display: none;
        }
        .f-photo-box::after {
          content: '';
          position: absolute;
          inset: 0;
          box-shadow: inset 0 0 1.2em rgb(10 6 0 / 70%);
        }
        .f-wall {
          position: absolute;
          inset: 0;
          background-color: #2b2721;
        }

      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }

          // mulberry32: small seeded PRNG, values in [0, 1)
          function rng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = a;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function tokenOf(root, name, fallback) {
            var v = window.getComputedStyle(root).getPropertyValue(name).trim();
            return v === '' ? fallback : v;
          }

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos").
            function held(ease, duration) {
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / hold));
              if (hold === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);
              };
            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; unknown entrances fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,
              );
              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {
              if (!(jitterPx > 0) || hold < 2) return;
              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/framed-portrait: a picture in a carved gilt frame (or a polaroid, or bare) with a tag above;
        // a slow push in, optionally a zoom to a point; with `empty` the picture leaves the frame; then a
        // red stamp slams on the frame's lower right edge as the frame thuds down (cue `frame-down`).
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var H = __H__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var page = root.querySelector('.v-page');
          page.classList.add('bg-' + (v.bg || 'dark'));
          var group = root.querySelector('.f-group');
          var frame = root.querySelector('.f-frame');
          var box = root.querySelector('.f-photo-box');
          var iris = root.querySelector('.f-iris');
          var zoom = root.querySelector('.f-zoom');
          var photo = root.querySelector('.f-photo');
          var wall = root.querySelector('.f-wall');
          var tag = root.querySelector('.f-tag');
          var stamp = root.querySelector('.f-stamp');
          var kind = v.frame || 'gold';
          frame.classList.add(kind);
          photo.setAttribute('src', v.media);
          var land = W / H >= 1.2;
          // frame size and place: the reel panel (small, a little left of centre) or a taller portrait one
          var fh = land ? H * 0.56 : H * 0.34;
          // the gilt frame photo is 640x763; its window insets in % (left, top, right, bottom)
          // (drawn a little taller, 0.75, like the reel's frame)
          var aspect = kind === 'gold' ? 0.75 : kind === 'polaroid' ? 0.84 : 0.72;
          var fw = fh * aspect;
          var cx = land ? W * 0.44 : W * 0.5;
          var cy = land ? H * 0.48 : H * 0.5;
          var cam = root.querySelector('.f-cam');
          var PUSH = 1.36;
          var fx = cx - fw / 2;
          var fy = cy - fh / 2;
          group.style.left = Math.round(fx) + 'px';
          group.style.top = Math.round(fy) + 'px';
          group.style.width = Math.round(fw) + 'px';
          group.style.height = Math.round(fh) + 'px';
          group.style.fontSize = Math.round(fh / 30) + 'px';
          var inset =
            kind === 'gold'
              ? [24.7, 24.7, 24.7, 20.4]
              : kind === 'polaroid'
                ? [5.5, 5.5, 5.5, 20]
                : [0, 0, 0, 0];
          // a little under the carving so no gap shows at the window edge
          var o = kind === 'gold' ? 1.5 : 0;
          box.style.left = inset[0] - o + '%';
          box.style.top = inset[1] - o + '%';
          box.style.right = inset[2] - o + '%';
          box.style.bottom = inset[3] - o + '%';
          if (kind === 'polaroid') gsap.set(frame, { rotation: -3 });
          // tag: centred over the frame, near the top edge as in the reel
          if (v.tag) {
            tag.textContent = v.tag;
            var tfs = Math.round(land ? H * 0.03 : W * 0.034);
            tag.style.fontSize = tfs + 'px';
            tag.style.left = Math.round(cx) + 'px';
            tag.style.top = Math.round(land ? H * 0.04 : fy - tfs * 3) + 'px';
          } else {
            tag.style.display = 'none';
          }
          var zx = v.zoomTo ? v.zoomTo.x : 50;
          var zy = v.zoomTo ? v.zoomTo.y : 40;
          gsap.set(tag, { xPercent: -50 });
          gsap.set(zoom, { transformOrigin: zx + '% ' + zy + '%' });
          // the camera push: in the reel the whole panel grows about a point up and left of the frame
          gsap.set(cam, {
            transformOrigin: land
              ? Math.round(fx - fw * 0.3) + 'px ' + Math.round(fy) + 'px'
              : Math.round(cx) + 'px ' + Math.round(fy + fh * 0.3) + 'px',
          });
          if (v.stamp) {
            stamp.textContent = v.stamp;
            var sfs = fh * (v.stamp.length > 8 ? 0.085 : 0.15);
            stamp.style.fontSize = Math.round(sfs) + 'px';
            stamp.style.filter = 'url(#__ID__-worn)';
            // past the frame's right edge in a wide panel (as in the reel), on its lower right corner in
            // a portrait frame so the pushed-in stamp stays inside the safe area
            // estimated width (no layout read before fonts load), kept left of 88 % of the width after the push
            var est = v.stamp.length * sfs * 0.66;
            var ox = land ? fx - fw * 0.3 : cx;
            var maxLeft = (W * 0.88 - ox) / PUSH + ox - est - fx;
            stamp.style.left = Math.round(Math.min(fw * (land ? 0.9 : 0.58), maxLeft)) + 'px';
            stamp.style.top = Math.round(fh * 0.8 - sfs * 0.5) + 'px';
            gsap.set(stamp, { rotation: 4, transformOrigin: '30% 50%' });
          } else {
            stamp.style.display = 'none';
          }
          if (!v.empty) wall.style.display = 'none';
          var tl = gsap.timeline({ paused: true });
          if (v.skipEntrance) {
            // resting state: the entrance's end (pushed in, zoomed, picture gone, stamp down)
            gsap.set(cam, { scale: PUSH });
            if (v.zoomTo) gsap.set(zoom, { scale: 2.4 });
          } else {
            M.pop(tl, group, 0, 0.4);
            // slow push in, over before minEntranceMs so the resting state is the end of the entrance
            tl.to(cam, { scale: PUSH, duration: 1.6, ease: 'power1.inOut' }, 0.45);
            if (kind !== 'gold') {
              var open = 'circle(0% at ' + zx + '% ' + zy + '%)';
              var wide = 'circle(80% at ' + zx + '% ' + zy + '%)';
              tl.fromTo(
                iris,
                { clipPath: open },
                { clipPath: wide, duration: 0.5, ease: M.held('power2.out', 0.5) },
                0.3,
              );
            }
            if (v.tag) M.pop(tl, tag, 0.5, 0.3);
            if (v.zoomTo) {
              tl.fromTo(
                zoom,
                { scale: 1 },
                { scale: 2.4, duration: 0.8, ease: 'power2.inOut' },
                0.95,
              );
            }
            if (v.empty) {
              // the picture leaves: the bare wall slides over it from the left
              tl.fromTo(
                wall,
                { xPercent: -101 },
                { xPercent: 0, duration: 0.45, ease: M.held('power2.inOut', 0.45) },
                1.1,
              );
            }
            // the frame lifts a little, then thuds down together with the stamp (cue `frame-down`)
            tl.fromTo(
              frame,
              { y: 0 },
              { y: -14, duration: 0.15, ease: M.held('power1.out', 0.15) },
              1.7,
            );
            tl.to(frame, { y: 0, duration: 0.1, ease: M.held('power3.in', 0.1) }, 1.85);
            if (v.stamp) {
              tl.fromTo(
                stamp,
                { scale: 2.3, opacity: 0 },
                { scale: 1, opacity: 0.92, duration: 0.15, ease: M.held('power3.in', 0.15) },
                1.75,
              );
            }
          }
          tl.set(root, {}, DUR);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
