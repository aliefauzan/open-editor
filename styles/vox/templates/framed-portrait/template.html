<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .v-page {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background-color: var(--tok-color-dark);
          color: var(--tok-color-paper);
        }
        .v-page::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 50% auto;
          mix-blend-mode: multiply;
          opacity: 0.4;
        }
        .v-page.bg-dark::after {
          content: '';
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 30%, transparent 45%, rgb(0 0 0 / 50%) 100%);
        }
        .v-page.bg-paper {
          background-color: var(--tok-color-paper);
          color: var(--tok-color-ink);
        }
        .v-page.bg-paper::before {
          opacity: 0.3;
        }
        .v-page.bg-highlight {
          background-color: var(--tok-color-highlight);
          color: var(--tok-color-ink);
        }
        .f-tag {
          position: absolute;
          left: 50%;
          top: 5.2%;
          max-width: 70%;
          width: max-content;
          padding: 0.25em 0.6em 0.2em;
          background: var(--tok-color-highlight);
          color: var(--tok-color-ink);
          font-family: var(--tok-font-caption);
          font-weight: 700;
          text-align: center;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          overflow-wrap: anywhere;
        }
        .v-page.bg-highlight .f-tag {
          background: var(--tok-color-ink);
          color: var(--tok-color-highlight);
        }
        .f-frame {
          position: absolute;
          left: 22%;
          top: 10.5%;
          width: 56%;
          height: 38%;
          box-sizing: border-box;
        }
        .f-photo-box {
          position: absolute;
          overflow: hidden;
          background: #1c1915;
          inset: 0;
        }
        .f-iris {
          position: absolute;
          inset: 0;
        }
        .f-zoom {
          position: absolute;
          inset: 0;
        }
        .f-photo {
          width: 100%;
          height: 100%;
          object-fit: cover;
          filter: grayscale(1) contrast(1.4) brightness(1.05) sepia(0.2);
        }
        .f-dots {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(circle, rgb(20 16 10 / 55%) 1.2px, transparent 1.9px);
          background-size: 5px 5px;
          mix-blend-mode: multiply;
        }
        .f-photo-box::after {
          content: '';
          position: absolute;
          inset: 0;
          box-shadow: inset 0 0 50px rgb(30 20 5 / 60%);
        }
        /* gold frame: bevelled gradient, a bead ring, corner bosses */
        .f-frame.gold {
          background: linear-gradient(
            135deg,
            #f7e39a 0%,
            #b9892f 24%,
            #f2d77f 46%,
            #7f5817 74%,
            #e1bf5f 100%
          );
          box-shadow:
            0 24px 50px rgb(0 0 0 / 55%),
            inset 0 0 0 3px #5e400f,
            inset 0 0 0 13px #d9b24c,
            inset 0 0 0 16px #5e400f;
        }
        .f-frame.gold::before {
          content: '';
          position: absolute;
          inset: 4.4%;
          border: 9px dotted rgb(90 60 10 / 80%);
          border-radius: 6px;
        }
        .f-frame.gold::after {
          content: '';
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle 52px at 0 0, #f4dc88 55%, #6e4a12 60%, transparent 66%),
            radial-gradient(circle 52px at 100% 0, #f4dc88 55%, #6e4a12 60%, transparent 66%),
            radial-gradient(circle 52px at 0 100%, #f4dc88 55%, #6e4a12 60%, transparent 66%),
            radial-gradient(circle 52px at 100% 100%, #f4dc88 55%, #6e4a12 60%, transparent 66%);
        }
        .f-frame.gold .f-photo-box {
          inset: 8.6% 8.6%;
          box-shadow:
            0 0 0 6px #4b330c,
            inset 0 0 18px rgb(0 0 0 / 70%);
        }
        .f-frame.polaroid {
          background: #f5f1e6;
          box-shadow:
            0 20px 44px rgb(0 0 0 / 45%),
            inset 0 0 0 1px rgb(120 100 60 / 30%);
        }
        .f-frame.polaroid .f-photo-box {
          inset: 5.5% 5.5% 20% 5.5%;
        }
        .f-frame.none {
          box-shadow: 0 20px 44px rgb(0 0 0 / 45%);
        }
        .f-stamp {
          position: absolute;
          right: 12%;
          top: 40%;
          padding: 0.05em 0.3em 0;
          color: var(--tok-color-accent);
          border: 0.09em solid var(--tok-color-accent);
          border-radius: 0.12em;
          font-family: var(--tok-font-display);
          font-weight: var(--tok-font-display-weight);
          line-height: 1.12;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          white-space: nowrap;
          opacity: 0.94;
          mix-blend-mode: multiply;
          background: rgb(237 232 223 / 14%);
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="v-page">
          <div class="f-tag"></div>
          <div class="f-frame">
            <div class="f-photo-box">
              <div class="f-iris">
                <div class="f-zoom">
                  <img class="f-photo" alt="" />
                  <div class="f-dots"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="f-stamp"></div>
        </div>
      </div>
      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }

          // mulberry32: small seeded PRNG, values in [0, 1)
          function rng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = a;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function tokenOf(root, name, fallback) {
            var v = window.getComputedStyle(root).getPropertyValue(name).trim();
            return v === '' ? fallback : v;
          }

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos").
            function held(ease, duration) {
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / hold));
              if (hold === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);
              };
            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; unknown entrances fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,
              );
              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {
              if (!(jitterPx > 0) || hold < 2) return;
              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/framed-portrait: halftone portrait in a frame, iris open, zoom to a point, stamp, thud.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var page = root.querySelector('.v-page');
          page.classList.add('bg-' + (v.bg || 'dark'));
          var frame = root.querySelector('.f-frame');
          var iris = root.querySelector('.f-iris');
          var zoom = root.querySelector('.f-zoom');
          var photo = root.querySelector('.f-photo');
          var tag = root.querySelector('.f-tag');
          var stamp = root.querySelector('.f-stamp');
          var kind = v.frame || 'gold';
          frame.classList.add(kind);
          photo.setAttribute('src', v.media);
          if (kind === 'polaroid') gsap.set(frame, { rotation: -3 });
          if (v.tag) {
            tag.textContent = v.tag;
            tag.style.fontSize = Math.round(W * 0.034) + 'px';
          } else {
            tag.style.display = 'none';
          }
          var cx = v.zoomTo ? v.zoomTo.x : 50;
          var cy = v.zoomTo ? v.zoomTo.y : 40;
          gsap.set(tag, { xPercent: -50 });
          gsap.set(zoom, { transformOrigin: cx + '% ' + cy + '%' });
          if (v.stamp) {
            stamp.textContent = v.stamp;
            stamp.style.fontSize = Math.round(W * (v.stamp.length > 8 ? 0.055 : 0.095)) + 'px';
            gsap.set(stamp, { rotation: -12 });
          } else {
            stamp.style.display = 'none';
          }
          var tl = gsap.timeline({ paused: true });
          if (v.skipEntrance) {
            // resting state: the entrance's end (iris open, zoomed, stamp down)
            if (v.zoomTo) gsap.set(zoom, { scale: 2.4 });
          } else {
            M.pop(tl, frame, 0, 0.4);
            var open = 'circle(0% at ' + cx + '% ' + cy + '%)';
            var wide = 'circle(80% at ' + cx + '% ' + cy + '%)';
            tl.fromTo(
              iris,
              { clipPath: open },
              { clipPath: wide, duration: 0.5, ease: M.held('power2.out', 0.5) },
              0.3,
            );
            if (v.tag) M.pop(tl, tag, 0.5, 0.3);
            if (v.zoomTo) {
              tl.fromTo(
                zoom,
                { scale: 1 },
                { scale: 2.4, duration: 0.8, ease: 'power2.inOut' },
                0.95,
              );
            }
            // the frame lifts a little, then thuds down together with the stamp (cue `frame-down`)
            tl.fromTo(
              frame,
              { y: 0 },
              { y: -14, duration: 0.15, ease: M.held('power1.out', 0.15) },
              1.7,
            );
            tl.to(frame, { y: 0, duration: 0.1, ease: M.held('power3.in', 0.1) }, 1.85);
            if (v.stamp) {
              tl.fromTo(
                stamp,
                { scale: 2.3, opacity: 0 },
                { scale: 1, opacity: 0.94, duration: 0.15, ease: M.held('power3.in', 0.15) },
                1.75,
              );
            }
          }
          tl.set(root, {}, DUR);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
