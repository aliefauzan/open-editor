        .v-page::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 50% auto;
          mix-blend-mode: multiply;
          opacity: 0.22;
        }
        .v-page::after {
          content: '';
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(0 0 0 / 38%) 100%);
          pointer-events: none;
        }
        .v-page.bg-paper {
          background-color: var(--tok-color-paper);
          color: var(--tok-color-ink);
          --y-line: var(--tok-color-sea);
        }
        .v-page.bg-paper::after,
        .v-page.bg-highlight::after {
          opacity: 0.35;
        }
        .v-page.bg-highlight {
          background-color: var(--tok-color-highlight);
          color: var(--tok-color-ink);
          --y-line: var(--tok-color-ink);
        }
        .y-dims {
          position: absolute;
          left: 0;
          top: 0;
          overflow: visible;
        }
        .y-dims path,
        .y-dims circle {
          fill: none;
          stroke: var(--y-line);
          stroke-linecap: round;
          stroke-linejoin: round;
          opacity: 0.5;
        }
        .y-dims .y-head {
          fill: var(--y-line);
          stroke: none;
        }
        .y-bpimg {
          position: absolute;
          object-fit: contain;
          object-position: left center;
          opacity: 0.48;
          /* a dark-on-light line drawing becomes thin light lines on the board */
          filter: grayscale(1) contrast(1.8) invert(1);
          mix-blend-mode: screen;
        }
        .v-page.bg-paper .y-bpimg,
        .v-page.bg-highlight .y-bpimg {
          filter: grayscale(1) contrast(1.6);
          mix-blend-mode: multiply;
          opacity: 0.45;
        }
        .y-year {
          position: absolute;
          font-family: var(--tok-font-display);
          font-weight: var(--tok-font-display-weight);
          line-height: 1;
          letter-spacing: -0.01em;
          white-space: nowrap;
          /* the reel's year is a heavy serif: thicken DM Serif Display a little */
          -webkit-text-stroke: 0.022em currentColor;
          paint-order: stroke fill;
          text-shadow: 0 2px 6px rgb(0 0 0 / 35%);
        }
        .v-page.bg-paper .y-year,
        .v-page.bg-highlight .y-year {
          text-shadow: none;
        }
        /* the photo print: a cream border, a soft drop shadow */
        .y-card {
          position: absolute;
          box-sizing: border-box;
          background: #ece6d3;
          box-shadow:
            0 0.6em 1.4em rgb(0 0 0 / 55%),
            inset 0 0 0 1px rgb(120 100 60 / 30%);
        }
        .y-card::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 120% auto;
          mix-blend-mode: multiply;
          opacity: 0.35;
        }
        .y-photo-box {
          position: absolute;
          overflow: hidden;
          background: #3a3833;
          box-shadow: inset 0 0 0 1px rgb(60 50 30 / 40%);
        }
        .y-photo {
          width: 100%;
          height: 100%;
          object-fit: cover;
          filter: grayscale(1) sepia(0.18) contrast(1.05) brightness(1.04);
        }
        .y-photo-box::after {
          content: '';
          position: absolute;
          inset: 0;
          background: radial-gradient(
            ellipse at 50% 50%,
            transparent 55%,
            rgb(30 24 12 / 42%) 100%
          );
        }
        .y-tag {
          position: absolute;
          padding: 0.32em 0.55em 0.26em;
          background: var(--tok-color-highlight);
          color: #111;
          font-family: 'Vox Grotesk', var(--tok-font-caption);
          font-weight: 800;
          line-height: 1;
          text-transform: uppercase;
          letter-spacing: 0.035em;
          white-space: nowrap;
        }
        .v-page.bg-highlight .y-tag {
          background: var(--tok-color-ink);
          color: var(--tok-color-highlight);
        }

      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;

          // mulberry32: small seeded PRNG, values in [0, 1)

              a = (a + 0x6d2b79f5) >>> 0;

            var v = window.getComputedStyle(root).getPropertyValue(name).trim();

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos").
            function held(ease, duration) {
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / hold));
              if (hold === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);

            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; unknown entrances fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,

              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {

              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/year-card: year, line drawing with dimension lines, tilted photo print, yellow tag.
        // Landscape canvases (a `stack` panel, D-71) use the reel panel's layout; portrait ones a taller one.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var H = __H__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var page = root.querySelector('.v-page');
          page.classList.add('bg-' + (v.bg || 'dark'));
          var year = root.querySelector('.y-year');
          var card = root.querySelector('.y-card');
          var box = root.querySelector('.y-photo-box');
          var photo = root.querySelector('.y-photo');
          var tag = root.querySelector('.y-tag');
          var dims = root.querySelector('.y-dims');
          var bpImg = root.querySelector('.y-bpimg');
          var land = W / H >= 1.2;
          // stage: the 16:9 area the landscape layout uses (the whole canvas of a 16:9 panel)
          var sw = land ? Math.min(W, (H * 16) / 9) : W;
          var sh = land ? (sw * 9) / 16 : H;
          var sx = (W - sw) / 2;
          var sy = (H - sh) / 2;
          var u = sw / 100;
          var h = sh / 100;
          // geometry: [left, top, width, height] in stage % (measured on the reel panel at 7.5-9.6 s)
          var L = land
            ? {
                year: [4.0, 8.6, 29, 25],
                tag: [3.6, 37.6, 3.3],
                card: [30.6, 26.8, 57, 58.5, 1.6],
                draw: [-0.5, 19.5, 98, 47],
                dims: { top: 13.6, bottom: 79.2, left: 0.8, right: 97.2, side: 98.8, ext: 86 },
              }
            : {
                year: [12.5, 12.5, 75, 11.6],
                tag: [12.5, 24.6, 3.4],
                card: [9, 40.5, 84, 27, 1.6],
                draw: [-3, 28.2, 104, 14],
                dims: { top: 26.6, bottom: 70.5, left: 2.5, right: 95.5, side: 97.6, ext: 86 },
              };
          function px(xp, yp) {
            return [sx + xp * u, sy + yp * h];
          }
          // year: as big as the reel's, smaller when long so it stays above the photo
          year.textContent = v.year;
          var fs = L.year[3] * h;
          year.style.fontSize = fs + 'px';
          var maxW = (land && v.year.length > 5 ? 2.1 : 1) * L.year[2] * u;
          // estimated width (DM Serif Display figures are about 0.56 em), no layout read before fonts load
          var wNow = v.year.length * fs * 0.43;
          if (wNow > maxW) fs = (fs * maxW) / wNow;
          year.style.fontSize = Math.round(fs) + 'px';
          var yp = px(L.year[0], L.year[1]);
          year.style.left = Math.round(yp[0]) + 'px';
          // keep the cap line where the reel has it, also for smaller sizes
          year.style.top = Math.round(yp[1] + (L.year[3] * h - fs) * 0.75) + 'px';
          // tag
          tag.textContent = v.tag;
          tag.style.fontSize = Math.round(land ? L.tag[2] * h : L.tag[2] * u * 1.0) + 'px';
          var tp = px(L.tag[0], L.tag[1]);
          tag.style.left = Math.round(tp[0]) + 'px';
          tag.style.top = Math.round(tp[1]) + 'px';
          tag.style.maxWidth = Math.round(land ? 26 * u : 75 * u) + 'px';
          tag.style.whiteSpace = 'normal';
          // photo print
          var c = L.card;
          var cp = px(c[0], c[1]);
          var cw = c[2] * u;
          var ch = c[3] * h;
          var bw = Math.round(c[4] * u);
          card.style.left = Math.round(cp[0]) + 'px';
          card.style.top = Math.round(cp[1]) + 'px';
          card.style.width = Math.round(cw) + 'px';
          card.style.height = Math.round(ch) + 'px';
          card.style.fontSize = Math.round(u * 1.4) + 'px';
          box.style.left = bw + 'px';
          box.style.top = bw + 'px';
          box.style.right = bw + 'px';
          box.style.bottom = Math.round(bw * 1.15) + 'px';
          photo.setAttribute('src', v.photo);
          // line drawing behind the print
          var d = L.draw;
          var dp = px(d[0], d[1]);
          if (v.blueprint) {

            bpImg.style.left = Math.round(dp[0]) + 'px';
            bpImg.style.top = Math.round(dp[1]) + 'px';
            bpImg.style.width = Math.round(d[2] * u) + 'px';
            bpImg.style.height = Math.round(d[3] * h) + 'px';
          } else {
            bpImg.style.display = 'none';
          }
          // dimension lines (and, without a drawing, a generic construction drawing): drawn by the entrance
          var NS = 'http://www.w3.org/2000/svg';
          dims.setAttribute('width', W);
          dims.setAttribute('height', H);
          dims.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
          var sw1 = Math.max(1, Math.round(sw / 760));
          var g = L.dims;
          var lines = [];
          function line(dd, width) {
            var p = root.ownerDocument.createElementNS(NS, 'path');
            p.setAttribute('d', dd);
            p.setAttribute('pathLength', '1');
            p.setAttribute('stroke-width', width || sw1);
            dims.appendChild(p);
            lines.push(p);
            return p;
          }
          function arrow(x, y, dir) {
            var a = 1.1 * u;
            var p = root.ownerDocument.createElementNS(NS, 'path');
            p.setAttribute('class', 'y-head');
            p.setAttribute(
              'd',
              'M' +
                x +
                ' ' +
                y +
                'L' +
                (x + dir * a) +
                ' ' +
                (y - a * 0.32) +
                'L' +
                (x + dir * a) +
                ' ' +
                (y + a * 0.32) +
                'Z',
            );
            dims.appendChild(p);
            return p;
          }
          var X = function (p) {
            return sx + p * u;
          };
          var Y = function (p) {

          [g.top, g.bottom].forEach(function (yy) {
            line('M' + X(g.left) + ' ' + Y(yy) + 'H' + X(g.right));

          line('M' + X(g.left) + ' ' + Y(g.top - 2.5) + 'V' + Y(g.bottom + 2.5));
          line('M' + X(g.right) + ' ' + Y(g.top - 2.5) + 'V' + Y(g.bottom + 2.5));
          line('M' + X(g.side) + ' ' + Y(d[1]) + 'V' + Y(g.bottom));
          line('M' + X(g.ext) + ' ' + Y(d[1]) + 'H' + X(100));
          line('M' + X(g.ext) + ' ' + Y(d[1] + d[3] * 0.98) + 'H' + X(100));
          if (!v.blueprint) {
            // generic drawing: a wheel-like disc and a box with a centre line, in the drawing area
            var cx = X(d[0] + d[2] * 0.3);
            var cy = Y(d[1] + d[3] * 0.5);
            var r = d[3] * h * 0.42;
            line(
              'M' +
                (cx - r) +
                ' ' +
                cy +
                'a' +
                r +
                ' ' +
                r +
                ' 0 1 0 ' +
                2 * r +
                ' 0a' +
                r +
                ' ' +
                r +
                ' 0 1 0 ' +
                -2 * r +
                ' 0',
            );
            line(
              'M' +
                (cx - r * 0.55) +
                ' ' +
                cy +
                'a' +
                r * 0.55 +
                ' ' +
                r * 0.55 +
                ' 0 1 0 ' +
                r * 1.1 +
                ' 0a' +
                r * 0.55 +
                ' ' +
                r * 0.55 +
                ' 0 1 0 ' +
                -r * 1.1 +
                ' 0',
            );
            line('M' + X(d[0] + 1) + ' ' + cy + 'H' + X(d[0] + d[2]));
            line(
              'M' +
                X(d[0] + d[2] * 0.55) +
                ' ' +
                Y(d[1] + d[3] * 0.18) +
                'h' +
                d[2] * u * 0.4 +
                'v' +
                d[3] * h * 0.64 +
                'h' +
                -d[2] * u * 0.4 +

            gsap.set(lines, { strokeDasharray: 1, strokeDashoffset: 1 });

            tl.fromTo(
              lines,
              { strokeDashoffset: 1 },
              {
                strokeDashoffset: 0,
                duration: 0.6,
                ease: M.held('power1.inOut', 0.6),
                stagger: 0.04,
              },
              0.1,

            tl.fromTo(heads, { opacity: 0 }, { opacity: 0.5, duration: 0.01 }, 0.6);

              tl.fromTo(
                bpImg,
                { clipPath: 'inset(0 100% 0 0)' },
                { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: M.held('power1.inOut', 0.7) },
                0.1,
              );

            M.pop(tl, tag, 1.0, 0.3);
          }
          tl.set(root, {}, DUR);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
