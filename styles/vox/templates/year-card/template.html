<!doctype html>

    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .v-page {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background-color: var(--tok-color-dark);
          color: var(--tok-color-paper);
          --y-line: #cdbf9d;
        }
        .v-page::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 50% auto;
          mix-blend-mode: multiply;
          opacity: 0.35;
        }
        .v-page.bg-paper {
          background-color: var(--tok-color-paper);
          color: var(--tok-color-ink);
          --y-line: var(--tok-color-sea);
        }
        .v-page.bg-paper::before {
          opacity: 0.3;
        }
        .v-page.bg-highlight {
          background-color: var(--tok-color-highlight);
          color: var(--tok-color-ink);
          --y-line: var(--tok-color-ink);
        }
        .y-bp {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .y-bp path,
        .y-bp circle,
        .y-bp rect {
          opacity: 0.8;
          fill: none;
          stroke: var(--y-line);
          stroke-width: 3px;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .y-bp .y-grid {
          stroke-width: 1.5px;
          opacity: 0.18;
        }
        .y-bp .y-fine {
          stroke-width: 1.5px;
          opacity: 0.55;
        }
        .y-bpimg {
          position: absolute;
          left: 4%;
          top: 30%;
          width: 92%;
          height: 38%;
          object-fit: contain;
          opacity: 0.4;
          filter: grayscale(1) contrast(1.6) invert(1);
          mix-blend-mode: screen;
        }
        .v-page.bg-paper .y-bpimg,
        .v-page.bg-highlight .y-bpimg {
          filter: grayscale(1) contrast(1.6);
          mix-blend-mode: multiply;
          opacity: 0.3;
        }
        .y-year {
          position: absolute;
          left: 12%;
          top: 4.2%;
          font-family: var(--tok-font-display);
          font-weight: var(--tok-font-display-weight);
          line-height: 1;
          letter-spacing: -0.015em;
          white-space: nowrap;
        }
        .y-card {
          position: absolute;
          left: 24%;
          top: 14.5%;
          width: 66%;
          height: 29%;
          padding: 1.6%;
          box-sizing: border-box;
          background: #f1ead6;
          box-shadow:
            0 15px 32px rgb(0 0 0 / 50%),
            inset 0 0 0 1px rgb(120 100 60 / 35%);
        }
        .y-photo-box {
          position: absolute;
          inset: 3%;
          overflow: hidden;
          background: #2a2823;
        }
        .y-photo {
          width: 100%;
          height: 100%;
          object-fit: cover;
          filter: grayscale(1) sepia(0.35) contrast(1.08);
        }
        .v-page.bg-dark::after {
          content: '';
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse at 50% 35%, transparent 50%, rgb(0 0 0 / 45%) 100%);
          pointer-events: none;
        }
        .y-photo-box::after {
          content: '';
          position: absolute;
          inset: 0;
          box-shadow: inset 0 0 44px rgb(40 30 10 / 55%);
        }
        .y-tag {
          position: absolute;
          left: 24%;
          top: 46%;
          max-width: 58%;
          padding: 0.25em 0.6em 0.2em;
          background: var(--tok-color-highlight);
          color: var(--tok-color-ink);
          font-family: var(--tok-font-caption);
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          overflow-wrap: anywhere;
        }
        .v-page.bg-highlight .y-tag {
          background: var(--tok-color-ink);
          color: var(--tok-color-highlight);
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="v-page">
          <svg class="y-bp" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
            <path
              class="y-grid"
              d="M0 100H1080M0 200H1080M0 300H1080M0 400H1080M0 500H1080M0 600H1080M0 700H1080M0 800H1080M0 900H1080M0 1000H1080M0 1100H1080M0 1200H1080M0 1300H1080M0 1400H1080M0 1500H1080M0 1600H1080M0 1700H1080M0 1800H1080M0 1900H1080M100 0V1920M200 0V1920M300 0V1920M400 0V1920M500 0V1920M600 0V1920M700 0V1920M800 0V1920M900 0V1920M1000 0V1920"
            />
            <circle class="y-draw" pathLength="1" cx="330" cy="900" r="300" />
            <circle class="y-draw" pathLength="1" cx="330" cy="900" r="190" />
            <circle class="y-draw y-fine" pathLength="1" cx="330" cy="900" r="45" />
            <path class="y-draw y-fine" pathLength="1" d="M10 900H650M330 560V1240" />
            <path class="y-draw y-fine" pathLength="1" d="M118 688L542 1112M542 688L118 1112" />
            <rect class="y-draw" pathLength="1" x="600" y="780" width="420" height="340" />
            <path
              class="y-draw y-fine"
              pathLength="1"
              d="M600 880H1020M600 1000H1020M720 780V1120M860 780V1120"
            />
            <path
              class="y-draw y-fine"
              pathLength="1"
              d="M600 1190H1020M600 1170V1210M1020 1170V1210M810 1170V1210"
            />
            <path
              class="y-draw y-fine"
              pathLength="1"
              d="M1070 780V1120M1050 780H1090M1050 1120H1090"
            />
            <path
              class="y-draw y-fine"
              pathLength="1"
              d="M30 1330H1050M30 1310V1350M1050 1310V1350"
            />
          </svg>
          <img class="y-bpimg" alt="" />
          <div class="y-year"></div>
          <div class="y-card">
            <div class="y-photo-box"><img class="y-photo" alt="" /></div>
          </div>
          <div class="y-tag"></div>
        </div>
      </div>
      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }

          // mulberry32: small seeded PRNG, values in [0, 1)
          function rng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = a;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function tokenOf(root, name, fallback) {
            var v = window.getComputedStyle(root).getPropertyValue(name).trim();
            return v === '' ? fallback : v;
          }

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos").
            function held(ease, duration) {
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / hold));
              if (hold === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);
              };
            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; unknown entrances fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,
              );
              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {
              if (!(jitterPx > 0) || hold < 2) return;
              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/year-card: year, self-drawing blueprint, tilted framed photo, yellow tag.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var page = root.querySelector('.v-page');
          page.classList.add('bg-' + (v.bg || 'dark'));
          var year = root.querySelector('.y-year');
          var card = root.querySelector('.y-card');
          var photo = root.querySelector('.y-photo');
          var tag = root.querySelector('.y-tag');
          var bp = root.querySelector('.y-bp');
          var bpImg = root.querySelector('.y-bpimg');
          var draws = root.querySelectorAll('.y-draw');
          year.textContent = v.year;
          var n = v.year.length;
          year.style.fontSize = Math.round(W * (n > 8 ? 0.11 : n > 5 ? 0.15 : 0.2)) + 'px';
          tag.textContent = v.tag;
          tag.style.fontSize = Math.round(W * 0.03) + 'px';
          photo.setAttribute('src', v.photo);
          if (v.blueprint) {
            bpImg.setAttribute('src', v.blueprint);
            bp.style.display = 'none';
          } else {
            bpImg.style.display = 'none';
          }
          gsap.set(card, { rotation: -2.2 });
          gsap.set(tag, { rotation: -1.2 });
          var tl = gsap.timeline({ paused: true });
          if (v.skipEntrance) {
            // resting state: the entrance's end (blueprint drawn, card in place)
            gsap.set(draws, { strokeDasharray: 1, strokeDashoffset: 0 });
          } else {
            gsap.set(draws, { strokeDasharray: 1, strokeDashoffset: 1 });
            M.pop(tl, year, 0, 0.4);
            if (v.blueprint) {
              tl.fromTo(
                bpImg,
                { clipPath: 'inset(0 100% 0 0)' },
                { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: M.held('power1.inOut', 0.7) },
                0.1,
              );
            } else {
              tl.fromTo(
                draws,
                { strokeDashoffset: 1 },
                {
                  strokeDashoffset: 0,
                  duration: 0.7,
                  ease: M.held('power1.inOut', 0.7),
                  stagger: 0.07,
                },
                0.1,
              );
            }
            M.slideIn(tl, card, 0.35, 125, 0, 0.5);
            M.pop(tl, tag, 1.0, 0.3);
          }
          tl.set(root, {}, DUR);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
