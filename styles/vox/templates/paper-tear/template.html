<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .t-sheet {
          position: absolute;
          top: -2%;
          bottom: -2%;
          width: 118%;
          left: 0;
          filter: drop-shadow(0 0 14px rgb(0 0 0 / 40%));
        }
        .t-paper {
          position: absolute;
          inset: 0;
          background-color: var(--tok-color-paper);
        }
        .t-paper::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 45% auto;
          mix-blend-mode: multiply;
          opacity: 0.45;
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="t-sheet"><div class="t-paper"></div></div>
      </div>
      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }

          // mulberry32: small seeded PRNG, values in [0, 1)
          function rng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = a;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function tokenOf(root, name, fallback) {
            var v = window.getComputedStyle(root).getPropertyValue(name).trim();
            return v === '' ? fallback : v;
          }

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos"); `by` overrides
            // the style's hold.
            function held(ease, duration, by) {
              var h = by || hold;
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / h));
              if (h === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);
              };
            }

            // How far a piece moves to sit just outside the frame on `side` (0 left, 1 right, 2 top,
            // 3 bottom), in the piece's own px; without layout (a stub DOM) a fixed 1200 px.
            function offFrame(el, side) {
              var far = 1200;
              if (el.getBoundingClientRect && root.getBoundingClientRect) {
                var r = el.getBoundingClientRect();
                var f = root.getBoundingClientRect();
                var k = root.offsetWidth && f.width ? root.offsetWidth / f.width : 1;
                far =
                  [r.right - f.left, f.right - r.left, r.bottom - f.top, f.bottom - r.top][side] *
                    k +
                  24;
              }
              return {
                x: side === 0 ? -far : side === 1 ? far : 0,
                y: side === 2 ? -far : side === 3 ? far : 0,
              };
            }

            // assemble(tl, el, at, d): a flat pre-cut paper piece pushed in from outside the frame on a seeded
            // side, turned a little and settling just off true, held on at least twos (paper-cut stop motion,
            // D-101). No opacity change: a piece is never drawn in place.
            function assemble(tl, el, at, d) {
              var side = Math.floor(random() * 4);
              var off = offFrame(el, side);
              var r0 = Number(gsap.getProperty(el, 'rotation')) || 0;
              var turn = (random() * 2 - 1) * 9;
              var rest = r0 + (random() * 2 - 1) * 1.2;
              var by = Math.max(2, hold);
              tl.fromTo(
                el,
                { x: off.x, y: off.y, rotation: r0 + turn },
                { x: 0, y: 0, rotation: rest, duration: d, ease: held(easing, d, by) },
                at,
              );
              // one late nudge: the piece is pressed into place a frame-hold after it lands
              tl.set(el, { rotation: r0 + (rest - r0) * 0.5 }, at + d + by / fps);
            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; `assemble` pushes the piece in from outside the frame (D-101); unknown entrances
            // fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'assemble') {
                assemble(tl, el, at, dur);
                return at + dur;
              }
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,
              );
              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {
              if (!(jitterPx > 0) || hold < 2) return;
              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              assemble: assemble,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/paper-tear: a sheet with torn edges sweeps across; it covers the whole frame at the cut
        // (half the duration), where its speed peaks (the `tear` cue).
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var sheet = root.querySelector('.t-sheet');
          var paper = root.querySelector('.t-paper');
          // torn edges: a seeded zigzag of 4 % depth down both sides
          var pts = [];
          var n = 28;
          for (var i = 0; i <= n; i++) pts.push(4 * M.random() + '% ' + (i * 100) / n + '%');
          for (var j = n; j >= 0; j--) pts.push(96 + 4 * M.random() + '% ' + (j * 100) / n + '%');
          paper.style.clipPath = 'polygon(' + pts.join(', ') + ')';
          var sw = W * 1.18;
          // centred at the cut: left edge at -(sw - W) / 2
          var mid = -(sw - W) / 2;
          var from = -sw;
          var to = W;
          if (v.direction === 'left') {
            from = W;
            to = -sw;
          }
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(
            sheet,
            { x: from },
            { x: mid, duration: DUR / 2, ease: M.held('power2.in', DUR / 2) },
            0,
          );
          tl.to(sheet, { x: to, duration: DUR / 2, ease: M.held('power2.out', DUR / 2) }, DUR / 2);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
