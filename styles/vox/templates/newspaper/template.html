<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .v-page {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background-color: var(--tok-color-dark);
          color: var(--tok-color-paper);
        }
        .v-page::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 50% auto;
          mix-blend-mode: multiply;
          opacity: 0.4;
        }
        .v-page.bg-paper {
          background-color: var(--tok-color-paper);
        }
        .v-page.bg-paper::before {
          opacity: 0.3;
        }
        .v-page.bg-highlight {
          background-color: var(--tok-color-highlight);
        }
        .n-sheet {
          position: absolute;
          left: 18%;
          width: 64%;
          aspect-ratio: 1 / 1.08;
          display: flex;
          flex-direction: column;
          top: 6.5%;
          box-sizing: border-box;
          padding: 3.4% 4.4% 4%;
          background-color: #ecdfba;
          background-image: var(--tok-texture-paper);
          background-size: 80% auto;
          background-blend-mode: soft-light;
          color: #1d1a14;
          box-shadow:
            0 24px 50px rgb(0 0 0 / 50%),
            inset 0 0 70px rgb(120 80 20 / 45%);
          hyphens: auto;
        }
        .n-mast {
          display: flex;
          justify-content: center;
          padding: 0.5em 0 0.35em;
          border-top: 5px double #1d1a14;
          border-bottom: 2px solid #1d1a14;
          font-family: var(--tok-font-caption);
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }
        .n-head {
          margin-top: 0.45em;
          text-align: center;
          font-family: var(--tok-font-display);
          font-weight: var(--tok-font-display-weight);
          line-height: 1;
          letter-spacing: 0.005em;
          text-transform: uppercase;
          overflow-wrap: anywhere;
        }
        .n-sub {
          margin-top: 0.55em;
          padding-top: 0.5em;
          border-top: 2px solid #1d1a14;
          text-align: center;
          font-family: var(--tok-font-body);
          font-style: italic;
          line-height: 1.22;
          overflow-wrap: anywhere;
        }
        .n-photo {
          display: block;
          width: 100%;
          margin-top: 0.8em;
          object-fit: cover;
          border: 2px solid #1d1a14;
          box-sizing: border-box;
          filter: grayscale(1) contrast(1.25) sepia(0.45);
          mix-blend-mode: multiply;
        }
        .n-cols {
          display: flex;
          gap: 4%;
          margin-top: auto;
          padding-top: 0.8em;
        }
        .n-col {
          flex: 1;
          background: repeating-linear-gradient(
            to bottom,
            rgb(29 26 20 / 55%) 0 3px,
            transparent 3px 11px
          );
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="v-page">
          <div class="n-sheet">
            <div class="n-mast"><span class="n-date"></span></div>
            <div class="n-head"></div>
            <div class="n-sub"></div>
            <img class="n-photo" alt="" />
            <div class="n-cols">
              <div class="n-col"></div>
              <div class="n-col"></div>
            </div>
          </div>
        </div>
      </div>
      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }

          // mulberry32: small seeded PRNG, values in [0, 1)
          function rng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = a;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function tokenOf(root, name, fallback) {
            var v = window.getComputedStyle(root).getPropertyValue(name).trim();
            return v === '' ? fallback : v;
          }

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos").
            function held(ease, duration) {
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / hold));
              if (hold === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);
              };
            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; unknown entrances fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,
              );
              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {
              if (!(jitterPx > 0) || hold < 2) return;
              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/newspaper: an aged clipping slides in, then the photo and the subhead land.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var page = root.querySelector('.v-page');
          page.classList.add('bg-' + (v.bg || 'paper'));
          var sheet = root.querySelector('.n-sheet');
          var mast = root.querySelector('.n-mast');
          var date = root.querySelector('.n-date');
          var head = root.querySelector('.n-head');
          var sub = root.querySelector('.n-sub');
          var photo = root.querySelector('.n-photo');
          var cols = root.querySelector('.n-cols');
          sheet.setAttribute('lang', v.language || 'en');
          head.textContent = v.headline;
          var n = v.headline.length;
          head.style.fontSize = Math.round(W * (n > 40 ? 0.047 : n > 20 ? 0.062 : 0.085)) + 'px';
          mast.style.fontSize = Math.round(W * 0.026) + 'px';
          if (v.date) date.textContent = v.date;
          else mast.style.display = 'none';
          if (v.subhead) {
            sub.textContent = v.subhead;
            sub.style.fontSize = Math.round(W * 0.03) + 'px';
          } else {
            sub.style.display = 'none';
          }
          if (v.photo) {
            photo.setAttribute('src', v.photo);
            photo.style.height = Math.round(W * (v.subhead && n > 40 ? 0.17 : 0.24)) + 'px';
          } else {
            photo.style.display = 'none';
          }
          cols.style.height = Math.round(W * (v.photo ? 0.1 : 0.34)) + 'px';
          gsap.set(sheet, { rotation: -1.8 });
          var tl = gsap.timeline({ paused: true });
          if (!v.skipEntrance) {
            M.slideIn(tl, sheet, 0, 0, 115, 0.55);
            tl.fromTo(
              sheet,
              { scale: 1 },
              { scale: 1.035, duration: 1.4, ease: 'power2.inOut' },
              0.3,
            );
            if (v.photo) M.pop(tl, photo, 0.7, 0.3);
            if (v.subhead) tl.fromTo(sub, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.0);
          } else {
            gsap.set(sheet, { scale: 1.035 });
          }
          tl.set(root, {}, DUR);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
