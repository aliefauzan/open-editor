        .v-page.bg-dark::before,
        .v-page.bg-highlight::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 50% auto;
          mix-blend-mode: multiply;
          opacity: 0.35;
        }
        .v-page.bg-highlight {
          background-color: var(--tok-color-highlight);
        }
        /* an aged front page: tan paper, darker edges, columns of small type */
        .n-sheet {
          position: absolute;
          box-sizing: border-box;
          background-color: #ddd0b0;
          color: #241c12;
          box-shadow: 0 0.9em 1.6em rgb(30 20 5 / 40%);
          overflow: hidden;
        }
        .n-sheet::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: var(--tok-texture-paper);
          background-size: 140% auto;
          mix-blend-mode: multiply;
          opacity: 0.45;
        }
        .n-sheet::after {
          content: '';
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse at 30% 20%, rgb(150 110 50 / 18%) 0%, transparent 30%),
            radial-gradient(ellipse at 75% 85%, rgb(140 100 40 / 20%) 0%, transparent 28%),
            radial-gradient(ellipse at 50% 50%, transparent 52%, rgb(110 75 25 / 55%) 100%);
          box-shadow: inset 0 0 1.4em rgb(90 60 20 / 55%);
          pointer-events: none;
        }
        .n-in {
          position: absolute;
          inset: 3.2% 4.5% 2.5%;
          display: flex;
          flex-direction: column;
          align-items: stretch;
        }
        .n-mast {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          font-family: var(--tok-font-body);
          font-size: 0.42em;
          line-height: 1;
          padding-bottom: 0.45em;
          border-bottom: 0.08em solid #3a2e1e;
          opacity: 0.85;
        }
        .n-head {
          margin-top: 0.12em;
          font-family: 'Vox Condensed', var(--tok-font-display);
          font-weight: 400;
          line-height: 1.02;
          text-transform: uppercase;
          letter-spacing: 0.01em;
          text-align: center;
          color: #1d160d;
          white-space: nowrap;
        }
        .n-sub {
          margin: 0.25em 0 0.1em;
          font-family: var(--tok-font-body);
          font-style: italic;
          font-weight: 700;
          font-size: 0.82em;
          line-height: 1.15;
          text-align: center;
        }
        .n-rule {
          align-self: center;
          width: 22%;
          height: 0;
          margin: 0.3em 0 0.5em;
          border-top: 0.06em solid #3a2e1e;
        }
        .n-cols {
          flex: 1;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          column-gap: 0.7em;
          overflow: hidden;
          min-height: 0;
        }
        .n-col {
          overflow: hidden;
          font-family: var(--tok-font-body);
          font-size: 0.3em;
          line-height: 1.28;
          text-align: justify;
          hyphens: auto;
          color: #2c2216;
          opacity: 0.88;
        }
        .n-col + .n-col {
          border-left: 0.03em solid rgb(58 46 30 / 45%);
          padding-left: 0.5em;
          margin-left: -0.5em;
        }
        .n-col b {
          display: block;
          margin: 0.6em 0 0.4em;
          text-align: center;
          font-size: 1.05em;
          letter-spacing: 0.04em;
        }

        .n-oval {
          position: relative;
          width: 100%;
          margin: 0.1em auto 0.6em;
          aspect-ratio: 0.78;
          border-radius: 50%;
          overflow: hidden;
          box-shadow:
            0 0 0 0.1em #d8c59c,
            0 0 0 0.16em #3a2e1e;
          background: #cdb98e;
        }
        .n-photo {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 50% 25%;
          filter: grayscale(1) contrast(1.45) brightness(1.05) sepia(0.45);
          mix-blend-mode: multiply;
        }
        .n-oval::after {
          content: '';
          position: absolute;
          inset: 0;
          background: repeating-linear-gradient(
            -12deg,
            rgb(40 28 12 / 34%) 0 1px,
            transparent 1px 3px
          );
          mix-blend-mode: multiply;
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="v-page">
          <div class="n-sheet">
            <div class="n-in">
              <div class="n-mast"><span class="n-date"></span><span class="n-no"></span></div>
              <div class="n-head"></div>
              <div class="n-sub"></div>
              <div class="n-rule"></div>
              <div class="n-cols">
                <div class="n-col"></div>
                <div class="n-col n-mid">
                  <div class="n-oval"><img class="n-photo" alt="" /></div>
                </div>
                <div class="n-col"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        // vox:motion:begin
        /* global window */
        // vox motion helpers (styles spec Part B "Tokens" motion; phase 07 step 3).
        // Templates inline a copy of this file between the `vox:motion` markers (scripts/sync-vox-motion.mjs
        // writes the copies; a test checks they equal this file). Everything is deterministic: timing comes
        // from the GSAP timeline only, and jitter uses a PRNG seeded from the scene instance id.
        (function () {
          'use strict';
          if (window.voxMotion) return;

          // FNV-1a 32-bit hash of a string: the jitter seed of a scene instance
          function hash(str) {
            var h = 0x811c9dc5;
            for (var i = 0; i < str.length; i++) {
              h ^= str.charCodeAt(i);
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }

          // mulberry32: small seeded PRNG, values in [0, 1)
          function rng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = a;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          function tokenOf(root, name, fallback) {
            var v = window.getComputedStyle(root).getPropertyValue(name).trim();
            return v === '' ? fallback : v;
          }

          // create(root, id): the helper set of one scene instance. `fps` is the frame grid the holds use
          // (the sequence's data-fps when present, else 30).
          function create(root, id, opts) {
            var o = opts || {};
            var gsap = window.gsap;
            var fpsAttr = window.document.querySelector('[data-fps]');
            var fps = o.fps || (fpsAttr ? Number(fpsAttr.getAttribute('data-fps')) : 30) || 30;
            var hold = Math.max(
              1,
              Math.round(Number(tokenOf(root, '--tok-motion-frame-hold', '1')) || 1),
            );
            var jitterPx = Number(tokenOf(root, '--tok-motion-jitter-px', '0')) || 0;
            var easing = tokenOf(root, '--tok-motion-easing', 'back.out(1.6)');
            var entrance = tokenOf(root, '--tok-motion-entrance', 'pop');
            var random = rng(hash(String(id)));
            var step = hold / fps;

            // An ease whose progress only changes every `hold` frames (animation "on twos").
            function held(ease, duration) {
              var base = gsap.parseEase(ease) || gsap.parseEase('none');
              var n = Math.max(1, Math.round((duration * fps) / hold));
              if (hold === 1) return base;
              return function (p) {
                return p >= 1 ? 1 : base(Math.floor(p * n) / n);
              };
            }

            // pop(tl, el, at, d?): the style entrance. `pop` scales up from 0.6 with the style easing,
            // held on twos; unknown entrances fall back to `fade` (styles spec "Tokens").
            function pop(tl, el, at, d) {
              var dur = d || 0.4;
              if (entrance === 'pop') {
                tl.fromTo(
                  el,
                  { scale: 0.6, opacity: 0 },
                  { scale: 1, opacity: 1, duration: dur, ease: held(easing, dur) },
                  at,
                );
              } else {
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'none' }, at);
              }
              jitter(tl, el, at, dur);
              return at + dur;
            }

            // slideIn(tl, el, at, fromX, fromY, d?): a card moving in, held on twos.
            function slideIn(tl, el, at, fromX, fromY, d) {
              var dur = d || 0.5;
              tl.fromTo(
                el,
                { xPercent: fromX, yPercent: fromY },
                { xPercent: 0, yPercent: 0, duration: dur, ease: held('power3.out', dur) },
                at,
              );
              return at + dur;
            }

            // jitter(tl, el, from, dur): seeded offsets of up to jitterPx on every held frame of
            // [from, from + dur), then rest at 0. Entrances only, so held shots stay still.
            function jitter(tl, el, from, dur) {
              if (!(jitterPx > 0) || hold < 2) return;
              var count = Math.max(1, Math.floor(dur / step));
              for (var i = 0; i < count; i++) {
                tl.set(
                  el,
                  {
                    x: Math.round((random() * 2 - 1) * jitterPx),
                    y: Math.round((random() * 2 - 1) * jitterPx),
                  },
                  from + i * step,
                );
              }
              tl.set(el, { x: 0, y: 0 }, from + count * step);
            }

            // pushIn(tl, el, from, dur, amount?): slow camera push, continuous (camera moves are never held).
            function pushIn(tl, el, from, dur, amount) {
              tl.fromTo(
                el,
                { scale: 1 },
                { scale: 1 + (amount || 0.06), duration: dur, ease: 'power2.inOut' },
                from,
              );
            }

            return {
              fps: fps,
              hold: hold,
              step: step,
              jitterPx: jitterPx,
              easing: easing,
              random: random,
              held: held,
              pop: pop,
              slideIn: slideIn,
              jitter: jitter,
              pushIn: pushIn,
            };
          }

          window.voxMotion = { create: create, hash: hash, rng: rng };
        })();
        // vox:motion:end
      </script>
      <script>
        // vox/newspaper: an aged front page (masthead line, condensed headline, italic subhead, three
        // columns of small type, an engraved oval photo) slides up onto the board.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          var W = __W__;
          var H = __H__;
          var DUR = __DUR__;
          var M = voxMotion.create(root, '__ID__');
          var page = root.querySelector('.v-page');
          page.classList.add('bg-' + (v.bg || 'paper'));
          var sheet = root.querySelector('.n-sheet');
          var mast = root.querySelector('.n-mast');
          var date = root.querySelector('.n-date');
          var no = root.querySelector('.n-no');
          var head = root.querySelector('.n-head');
          var sub = root.querySelector('.n-sub');
          var rule = root.querySelector('.n-rule');
          var cols = root.querySelectorAll('.n-col');
          var oval = root.querySelector('.n-oval');
          var photo = root.querySelector('.n-photo');
          var land = W / H >= 1.2;
          // the reel's page: a third of the panel wide, right of centre; portrait: 72 % of the width
          var pw = land ? W * 0.33 : W * 0.72;
          var ph = pw / 0.724;
          var px = land ? W * 0.422 : (W - pw) / 2;
          var py = land ? H * 0.157 : H * 0.2;
          sheet.style.left = Math.round(px) + 'px';
          sheet.style.top = Math.round(py) + 'px';
          sheet.style.width = Math.round(pw) + 'px';
          sheet.style.height = Math.round(ph) + 'px';
          // 1em = 3.6 % of the page width: every size inside the page scales with it
          sheet.style.fontSize = (pw * 0.036).toFixed(2) + 'px';
          sheet.setAttribute('lang', v.language || 'en');
          // a slightly ragged edge (seeded, so every render is the same)
          var pts = [];
          var n = 18;
          var j = function () {
            return (M.random() * 0.5).toFixed(2);
          };
          for (var i = 0; i <= n; i++) pts.push((i * 100) / n + '% ' + j() + '%');
          for (i = 0; i <= n; i++) pts.push(100 - j() + '% ' + (i * 100) / n + '%');
          for (i = n; i >= 0; i--) pts.push((i * 100) / n + '% ' + (100 - j()) + '%');
          for (i = n; i >= 0; i--) pts.push(j() + '% ' + (i * 100) / n + '%');
          sheet.style.clipPath = 'polygon(' + pts.join(',') + ')';
          if (v.date) {
            date.textContent = v.date;
            no.textContent = '— 1 —';
          } else {
            mast.style.borderBottomWidth = '0.08em';
            no.textContent = '';
          }
          // headline: balanced lines (1 to 3), sized so the longest line fills the page width.
          // Anton capitals are about 0.47 em wide; no layout read, so fonts loading late change nothing.
          var words = v.headline.trim().split(/\s+/);
          var total = v.headline.length;
          var nl = total <= 11 ? 1 : total <= 34 ? 2 : 3;
          var lines = [];
          var target = total / nl;
          var cur = '';
          for (i = 0; i < words.length; i++) {
            var next = cur ? cur + ' ' + words[i] : words[i];
            if (
              cur &&
              lines.length < nl - 1 &&
              Math.abs(next.length - target) > Math.abs(cur.length - target)
            ) {
              lines.push(cur);
              cur = words[i];
            } else {
              cur = next;
            }
          }
          lines.push(cur);
          var longest = 1;
          for (i = 0; i < lines.length; i++) longest = Math.max(longest, lines[i].length);
          var inner = pw * 0.91;
          var hfs = Math.min(pw * 0.2, inner / (longest * 0.47));
          head.style.fontSize = (hfs / (pw * 0.036)).toFixed(3) + 'em';
          for (i = 0; i < lines.length; i++) {
            var dline = root.ownerDocument.createElement('div');
            dline.textContent = lines[i];
            head.appendChild(dline);
          }
          if (v.subhead) sub.textContent = v.subhead;
          else sub.style.display = 'none';
          // body copy: seeded filler words (greeked text) in three columns
          var LOREM = (
            'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore ' +
            'et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ' +
            'ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur ' +
            'excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'
          ).split(' ');
          function para(k) {
            var out = [];
            for (var w = 0; w < k; w++) out.push(LOREM[Math.floor(M.random() * LOREM.length)]);
            var s = out.join(' ');
            return s.charAt(0).toUpperCase() + s.slice(1) + '.';
          }
          function fill(col, paras, heading) {
            for (var p = 0; p < paras; p++) {
              if (heading && p === 2) {
                var b = root.ownerDocument.createElement('b');
                b.textContent = para(4).toUpperCase();
                col.appendChild(b);
              }
              var el = root.ownerDocument.createElement('p');
              el.style.margin = '0 0 0.35em';
              el.style.textIndent = '1em';
              el.textContent = para(28 + Math.floor(M.random() * 30));
              col.appendChild(el);
            }
          }
          fill(cols[0], 8, false);
          fill(cols[1], 6, false);
          fill(cols[2], 8, true);
          if (v.photo) photo.setAttribute('src', v.photo);
          else oval.style.display = 'none';
          gsap.set(sheet, { rotation: land ? 0.6 : -0.8 });
          var tl = gsap.timeline({ paused: true });
          if (!v.skipEntrance) {
            M.slideIn(tl, sheet, 0, 0, 80, 0.5);
            tl.fromTo(
              sheet,
              { scale: 1 },
              { scale: 1.035, duration: 1.4, ease: 'power2.inOut' },
              0.3,
            );
            if (v.photo) M.pop(tl, oval, 0.7, 0.3);
            if (v.subhead) tl.fromTo(sub, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.0);
            tl.fromTo(
              rule,
              { scaleX: 0 },
              { scaleX: 1, duration: 0.3, ease: M.held('power2.out', 0.3) },
              1.0,
            );
          } else {
            gsap.set(sheet, { scale: 1.035 });
          }
          tl.set(root, {}, DUR);
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
