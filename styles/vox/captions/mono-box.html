<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .c-layer {
          position: absolute;
          inset: 0;
        }
        .c-chunk {
          position: absolute;
          opacity: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          white-space: nowrap;
        }
        .c-line {
          display: block;
          padding: 0.14em 0.4em;
          border-radius: 0.22em;
          background: var(--tok-color-caption-box);
        }
        .c-word {
          font-family: var(--tok-font-caption);
          font-weight: var(--tok-font-caption-weight);
          color: var(--tok-color-caption);
          letter-spacing: 0.02em;
        }
        .c-word.c-emph {
          background: var(--tok-color-accent);
          border-radius: 0.14em;
          padding: 0 0.12em;
          margin: 0 -0.12em;
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="c-layer"></div>
      </div>
      <script>
        // vox/mono-box (styles spec Part B): each line of a chunk is one black box; words cut on (no
        // fade). Unread and read words are white, the active word yellow; emphasis words sit on a red
        // box in every state. Lines come from the engine (never re-wrapped). The caption font is
        // monospaced, so a line's width is known without measuring the DOM; all state changes are
        // timeline sets at word times.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          // chunks go inside the composition's own markup, where its styles apply
          var layer = root.querySelector('.c-layer');
          var W = __W__;
          var H = __H__;
          var css = getComputedStyle(root);
          var white = css.getPropertyValue('--tok-color-caption').trim() || '#ffffff';
          var yellow = css.getPropertyValue('--tok-color-highlight').trim() || '#F5C518';
          var side = (v.safeArea.rightPct / 100) * W;
          var usable = W - 2 * side;
          // IBM Plex Mono advance 0.6 em (+0.02 em spacing), plus the box padding of 0.8 em
          var cols = Math.max(1, v.maxCharsPerLine);
          var size = Math.min(W * 0.05, usable / (cols * 0.62 + 0.8));
          // a line box: content 1.3 em (Plex Mono ascent + descent) + 0.28 em padding, plus a gap
          var lineH = size * 1.62;
          var limit = (1 - v.safeArea.bottomPct / 100) * H;
          var centre = (v.position.yPct / 100) * H;
          var tl = gsap.timeline({ paused: true });
          for (var i = 0; i < v.chunks.length; i++) {
            var c = v.chunks[i];
            var el = document.createElement('div');
            el.className = 'c-chunk';
            var h = c.lines.length * lineH;
            var top = Math.max(0, Math.min(centre - h / 2, limit - h));
            el.style.left = side + 'px';
            el.style.width = usable + 'px';
            el.style.top = top + 'px';
            el.style.fontSize = size + 'px';
            el.style.lineHeight = size * 1.3 + 'px';
            el.style.rowGap = size * 0.06 + 'px';
            for (var l = 0; l < c.lines.length; l++) {
              var line = document.createElement('div');
              line.className = 'c-line';
              var words = c.lines[l].words;
              for (var k = 0; k < words.length; k++) {
                var w = words[k];
                if (k > 0) line.appendChild(document.createTextNode(' '));
                var span = document.createElement('span');
                span.className = w.emphasis ? 'c-word c-emph' : 'c-word';
                span.setAttribute('data-key', w.key);
                span.textContent = w.text;
                line.appendChild(span);
                tl.set(span, { color: yellow }, w.startMs / 1000);
                tl.set(span, { color: white }, w.endMs / 1000);
              }
              el.appendChild(line);
            }
            layer.appendChild(el);
            tl.set(el, { opacity: 1 }, c.startMs / 1000);
            tl.set(el, { opacity: 0 }, c.endMs / 1000);
          }
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
