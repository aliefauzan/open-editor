<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .c-layer {
          position: absolute;
          inset: 0;
        }
        .c-chunk {
          position: absolute;
          opacity: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          white-space: nowrap;
        }
        .c-line {
          display: block;
        }
        .c-word {
          font-family: var(--tok-font-body);
          font-weight: 600;
          color: var(--tok-color-caption);
          opacity: 0;
          text-shadow:
            0 0.03em 0.08em rgb(0 0 0 / 85%),
            0 0 0.4em rgb(0 0 0 / 55%);
        }
        .c-word.c-emph {
          font-family: var(--tok-font-display);
          font-weight: var(--tok-font-display-weight);
          font-style: italic;
          font-size: 1.4em;
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="c-layer"></div>
      </div>
      <script>
        // vox/word-reveal: box-free, word by word at mid height (the documentary references in
        // phase 07). Unread words are hidden, the active word is full white, read words stay at
        // 80 %, emphasis words are a larger italic display serif. Lines come from the engine (never
        // re-wrapped); the box is placed from the font size and line count without measuring the
        // DOM; all state changes are timeline sets at word times.
        (function () {
          var mount = vox.mount('__ID__');
          var root = mount.root;
          var v = mount.vars;
          // chunks go inside the composition's own markup, where its styles apply
          var layer = root.querySelector('.c-layer');
          var W = __W__;
          var H = __H__;
          var side = (v.safeArea.rightPct / 100) * W;
          var usable = W - 2 * side;
          // Libre Caslon Text averages about 0.55 em per character; leave room for 1.4x emphasis
          var cols = Math.max(1, v.maxCharsPerLine);
          var size = Math.min(W * 0.052, usable / (cols * 0.55 * 1.4));
          // the line height covers a 1.4x emphasis word's content area (about 1.36 em)
          var lineH = size * 1.4 * 1.4;
          var limit = (1 - v.safeArea.bottomPct / 100) * H;
          var centre = (v.position.yPct / 100) * H;
          var tl = gsap.timeline({ paused: true });
          for (var i = 0; i < v.chunks.length; i++) {
            var c = v.chunks[i];
            var el = document.createElement('div');
            el.className = 'c-chunk';
            var h = c.lines.length * lineH;
            var top = Math.max(0, Math.min(centre - h / 2, limit - h));
            el.style.left = side + 'px';
            el.style.width = usable + 'px';
            el.style.top = top + 'px';
            el.style.fontSize = size + 'px';
            el.style.lineHeight = lineH + 'px';
            for (var l = 0; l < c.lines.length; l++) {
              var line = document.createElement('div');
              line.className = 'c-line';
              var words = c.lines[l].words;
              for (var k = 0; k < words.length; k++) {
                var w = words[k];
                if (k > 0) line.appendChild(document.createTextNode(' '));
                var span = document.createElement('span');
                span.className = w.emphasis ? 'c-word c-emph' : 'c-word';
                span.setAttribute('data-key', w.key);
                span.textContent = w.text;
                line.appendChild(span);
                tl.set(span, { opacity: 1 }, w.startMs / 1000);
                tl.set(span, { opacity: 0.8 }, w.endMs / 1000);
              }
              el.appendChild(line);
            }
            layer.appendChild(el);
            tl.set(el, { opacity: 1 }, c.startMs / 1000);
            tl.set(el, { opacity: 0 }, c.endMs / 1000);
          }
          window.__timelines[mount.key] = mount.register(tl);
        })();
      </script>
    </template>
  </body>
</html>
