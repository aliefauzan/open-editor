<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--tok-bg);
          font-family: Helvetica, Arial, sans-serif;
        }
        .v-frame {
          position: absolute;
          left: 48px;
          top: 678px;
          width: 984px;
          height: 564px;
          background: var(--tok-accent);
        }
        .v-video {
          position: absolute;
          left: 60px;
          top: 690px;
          width: 960px;
          height: 540px;
        }
        .v-title {
          position: absolute;
          left: 60px;
          top: 300px;
          width: 960px;
          height: 120px;
          font-size: 90px;
          color: var(--tok-fg);
        }
        .v-swatch,
        .v-token {
          position: absolute;
          top: 1720px;
          width: 100px;
          height: 100px;
        }
        .v-swatch {
          left: 60px;
        }
        .v-token {
          left: 180px;
          background: var(--tok-accent);
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="1080"
        data-height="1920"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="v-frame"></div>
        <video
          id="__ID__-slot"
          class="v-video"
          src="__SLOT_SRC__"
          data-start="0"
          data-duration="__DUR__"
          data-media-start="__SLOT_START__"
          muted
          playsinline
        ></video>
        <div class="v-title"></div>
        <div class="v-swatch"></div>
        <div class="v-token"></div>
      </div>
      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="__ID__"]');
          var title = root.querySelector('.v-title');
          var v = vox.vars(title);
          title.textContent = v.title;
          root.querySelector('.v-swatch').style.background = v.swatch;
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(title, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0);
          window.__timelines['__ID__'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
