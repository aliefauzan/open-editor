<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="n-label"></div>
      </div>
      <script>
        (function () {
          var mount = vox.mount('__ID__');
          mount.root.querySelector('.n-label').textContent = mount.vars.label;
          window.__timelines[mount.key] = mount.register(gsap.timeline({ paused: true }));
        })();
      </script>
    </template>
  </body>
</html>
