<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--tok-color-accent);
          color: var(--tok-color-ink);
          font-family: var(--tok-font-body);
          font-size: 64px;
        }
      </style>
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <div class="s-label"></div>
      </div>
      <script>
        (function () {
          var mount = vox.mount('__ID__');
          mount.root.querySelector('.s-label').textContent = mount.vars.label;
          window.__timelines[mount.key] = mount.register(gsap.timeline({ paused: true }));
        })();
      </script>
    </template>
  </body>
</html>
