<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--vox:tokens-->
      <div
        id="root"
        data-composition-id="__ID__"
        data-width="__W__"
        data-height="__H__"
        data-duration="__DUR__"
      >
        <!--vox:vars-->
        <img class="c-photo" alt="" />
      </div>
      <script>
        (function () {
          var mount = vox.mount('__ID__');
          if (mount.vars.photo) mount.root.querySelector('.c-photo').src = mount.vars.photo;
          window.__timelines[mount.key] = mount.register(gsap.timeline({ paused: true }));
        })();
      </script>
    </template>
  </body>
</html>
